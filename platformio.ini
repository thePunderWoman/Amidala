; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; `pio run` only builds the firmware.  Use `pio test -e native` for unit tests.
[platformio]
default_envs = esp32s3

[env:esp32s3]
; Pinned: the unversioned "espressif32" platform is a single shared cache
; slot on this machine, so working in other ESP32 repos can silently replace
; it with an incompatible core (e.g. an IDF5-based build that drops the
; legacy RMT API and ESP32-S3 classic-BT headers that Reeltwo's bundled
; PWMDecoder/PSController sources need). Pin so this build stays reproducible
; regardless of what other projects install.
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/embed_web.py
; Enable USB-CDC as Serial so UART0 (GPIO43/44) is free for the WCB serial out.
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
	; Force-include compatibility shim so third-party libs (HCR) compile on ESP32-S3
	; without source modifications (setWireTimeout → setTimeout mapping).
	-include include/esp32_compat.h
	; Allow non-conforming switch-case variable jumps in HCR library source.
	-fpermissive
; N16R8: 16 MB QIO flash + 8 MB OPI (Octal) PSRAM.
; espressif32@7.0.1's "esp32-s3-devkitc-1" board defaults to "No PSRAM" /
; 8 MB flash, and -DBOARD_HAS_PSRAM alone only tells app code PSRAM exists —
; it doesn't configure the SDK to actually bring up Octal PSRAM. Without this,
; the SDK inits PSRAM in QSPI mode by default, which doesn't match this
; board's Octal PSRAM chip ("PSRAM ID read error ... wrong PSRAM line mode"),
; leaving PSRAM in a broken state that led to a stack-canary panic on boot.
; The SPI bus lives on GPIO11/12/13 (moved off GPIO35-37 in the v1.1 redesign
; specifically so Octal PSRAM's reserved pins wouldn't conflict), so OPI mode
; is safe here.
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
; OTA dual-partition layout so the web update page can flash new firmware.
; Rollback is disabled via sdkconfig.defaults (avoids boot loops on init crashes).
board_build.partitions = partitions/ota_16MB.csv
lib_deps =
	https://github.com/reeltwo/Reeltwo#23.5.4
	https://github.com/reeltwo/ReeltwoAudio#v23.5.6
	; HumanCyborgRelationsAPI is in lib/ — local copy used, no remote entry needed.
	; EspSoftwareSerial provides SoftwareSerial.h so the unmodified HCR library compiles.
	plerup/EspSoftwareSerial
	; The ESP32 Arduino framework bundles its own SD library — do NOT add
	; arduino-libraries/SD here; that package is AVR-only (Sd2PinMap.h fails).
	adafruit/Adafruit NeoPixel@^1.15.4
	fastled/FastLED@^3.10.3
	https://github.com/basicmicro/roboclaw_arduino_library
	; andrewrapp/XBee omitted — XBee 3 SPI transport is implemented in-tree (PR esp32-2).
monitor_speed = 115200
monitor_port = /dev/cu.usb*

[env:native]
platform = native
; This env is only used via `pio test -e native`.  It is excluded from the
; default_envs above so `pio run` never tries to build it.
; scripts/native_lib_includes.py adds Reeltwo headers to the include path.
; Reeltwo is an Arduino library so PlatformIO's LDF marks it framework-
; incompatible for native and won't add it automatically; the script picks
; up either the local lib/ copy (dev) or the downloaded libdeps copy (CI).
extra_scripts = pre:scripts/native_lib_includes.py
build_flags = -std=c++14 -DUNIT_TEST -Itest -isysroot /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
test_build_src = no
lib_deps =
	https://github.com/reeltwo/Reeltwo#23.5.3
	https://github.com/roy86/HumanCyborgRelationsAPI
	adafruit/Adafruit NeoPixel@^1.15.4
	fastled/FastLED@^3.10.3
