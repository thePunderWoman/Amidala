; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; `pio run` only builds the firmware, using default_envs below (N16R8, the
; current Amidala PCB build). If your module is the other supported variant,
; build/upload with `-e esp32s3-n8r2` explicitly — flash size and PSRAM mode
; are baked into the image at build time, so this can't be a runtime setting;
; you must pick the right environment for your hardware before flashing.
; Use `pio test -e native` for unit tests.
[platformio]
default_envs = esp32s3-n16r8

; Shared base for both module variants — extended by env:esp32s3-n16r8 and
; env:esp32s3-n8r2 below. NOT an [env] section (which PlatformIO would apply
; to every environment, including env:native) — use `extends` instead.
[esp32s3_base]
; Pinned to a specific pioarduino release (not the bare "espressif32" name,
; and not the plain "@7.0.1" registry syntax) — an unversioned platform name
; is a single shared cache slot on this machine, so working in other ESP32
; repos can silently replace it out from under this project. Naming an exact
; release URL is fully reproducible regardless of what else touches the
; shared PlatformIO package cache.
;
; This is IDF5 (arduino-esp32 3.3.9) — previously avoided because Reeltwo's
; bundled PSController/PWMDecoder sources didn't compile under IDF5 (legacy
; RMT API removed; ESP32-S3 has no classic-BT headers to include). Fixed
; upstream in reeltwo/Reeltwo#18 / released as 23.5.5. A second, more
; serious gap surfaced once that landed: ServoDispatchESP32 (actual servo
; output, not an optional feature) called the classic-era LEDC API that
; arduino-esp32 3.x also removed — fixed upstream in reeltwo/Reeltwo#19 /
; released as 23.5.6 — see lib_deps below.
; Also worth it for PSRAM: this platform ships purpose-built N16R8V/N8R2
; board defs (see env sections below) with correctly vetted Octal/QSPI PSRAM
; bring-up, unlike espressif32@7.0.1's IDF 4.4.7, which either failed to
; detect this board's Octal PSRAM chip at all (silent runtime corruption,
; manifesting later as an unrelated-looking stack-canary panic) or hard
; boot-looped when told to use Octal mode explicitly — apparently immature
; ESP32-S3 Octal-PSRAM support in that older IDF branch.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
extra_scripts =
	pre:scripts/embed_web.py
	pre:scripts/fix_idf_include_paths.py
; Enable USB-CDC as Serial so UART0 (GPIO43/44) is free for the WCB serial out.
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
	; Force-include compatibility shim so third-party libs (HCR) compile on ESP32-S3
	; without source modifications (setWireTimeout → setTimeout mapping).
	-include include/esp32_compat.h
	; Allow non-conforming switch-case variable jumps in HCR library source.
	-fpermissive
	; roboclaw_arduino_library has functions missing a return on some paths —
	; harmless under the older toolchain's GCC, but this platform's newer GCC
	; treats -Werror=return-type as fatal. Not our source to fix.
	-Wno-error=return-type
lib_deps =
	https://github.com/reeltwo/Reeltwo#23.5.6
	https://github.com/reeltwo/ReeltwoAudio#v23.5.7
	; HumanCyborgRelationsAPI is in lib/ — local copy used, no remote entry needed
	; here. Get it from https://github.com/thePunderWoman/HumanCyborgRelationsAPI
	; (a fork of roy86/HumanCyborgRelationsAPI with ESP32/IDF5 compile fixes —
	; see lib/README.md).
	; WCB_Client: the AP+STA WiFi coexistence fix (see wcb_client_controller.h)
	; landed upstream and released as 1.9.6 — no fork needed anymore. Remove
	; any local lib/WCB_Client/ copy from the old fork-and-clone workflow;
	; PlatformIO's LDF prefers a local lib/ copy over this lib_deps entry, so
	; a stale one left in place would silently keep building against it.
	; 1.9.7 added setMeshChannel() (see WCBClientController::begin()).
	https://github.com/greghulette/WCBClient#1.9.7
	; EspSoftwareSerial provides SoftwareSerial.h so the unmodified HCR library compiles.
	plerup/EspSoftwareSerial
	; The ESP32 Arduino framework bundles its own SD library — do NOT add
	; arduino-libraries/SD here; that package is AVR-only (Sd2PinMap.h fails).
	adafruit/Adafruit NeoPixel@^1.15.4
	fastled/FastLED@^3.10.3
	https://github.com/basicmicro/roboclaw_arduino_library
	; andrewrapp/XBee omitted — XBee 3 SPI transport is implemented in-tree (PR esp32-2).
monitor_speed = 115200
monitor_port = /dev/cu.usb*

[env:esp32s3-n16r8]
extends = esp32s3_base
; Purpose-built board def: 16 MB Quad flash + 8 MB Octal PSRAM, correctly
; configured (board_build.arduino.memory_type = qio_opi) out of the box.
board = esp32-s3-devkitc1-n16r8
; OTA dual-partition layout so the web update page can flash new firmware
; (the board default is a plain, non-OTA partition table).
; Rollback is disabled via sdkconfig.defaults (avoids boot loops on init crashes).
board_build.partitions = partitions/ota_16MB.csv

[env:esp32s3-n8r2]
extends = esp32s3_base
; Purpose-built board def: 8 MB Quad flash + 2 MB Quad PSRAM, correctly
; configured (board_build.arduino.memory_type = qio_qspi) out of the box.
board = esp32-s3-devkitc1-n8r2
board_build.partitions = partitions/ota_8MB.csv

[env:native]
platform = native
; This env is only used via `pio test -e native`.  It is excluded from the
; default_envs above so `pio run` never tries to build it.
; scripts/native_lib_includes.py adds Reeltwo headers to the include path.
; Reeltwo is an Arduino library so PlatformIO's LDF marks it framework-
; incompatible for native and won't add it automatically; the script picks
; up either the local lib/ copy (dev) or the downloaded libdeps copy (CI).
extra_scripts = pre:scripts/native_lib_includes.py
build_flags = -std=c++14 -DUNIT_TEST -Itest -isysroot /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
test_build_src = no
lib_deps =
	https://github.com/reeltwo/Reeltwo#23.5.6
	https://github.com/thePunderWoman/HumanCyborgRelationsAPI#1.0.3
	adafruit/Adafruit NeoPixel@^1.15.4
	fastled/FastLED@^3.10.3
