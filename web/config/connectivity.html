<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connectivity — AMIDALA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/common.css">
<script>!function(){var t=localStorage.getItem("amidala-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}()</script>
</head>
<body>
<div class="page-header">
  <a class="back" href="/">&#9664; BACK</a>
  <div class="page-title"><span class="dot"></span><span class="label">Connectivity</span><span class="dot"></span></div>
</div>
<main>
  <div id="status">LOADING&#8230;</div>
</main>
<script src="/assets/edit.js"></script>
<script>
function wifiOn(d) { return d.wifion === 'y'; }
function wcbOn(d)  { return d.wcbenable === 'y'; }

var SCHEMA = [
  {section:'XBee Remotes'},
  {key:'xbr', label:'Right (Drive Remote / Right Snips Controller)', type:'hex', note:'lower 32 bits of XBee address', restart:true},
  {key:'xbl', label:'Left (Dome Remote / Left Snips Controller)',    type:'hex', note:'lower 32 bits of XBee address', restart:true},
  {section:'WiFi Access Point'},
  {key:'wifion',       label:'Enable WiFi AP', type:'bool', restart:true},
  {key:'wifissid',     label:'SSID',           type:'text',     maxlength:32, note:'max 32 chars', when:wifiOn, restart:true},
  {key:'wifipassword', label:'Password',       type:'password', maxlength:64, note:'min 8 chars',  when:wifiOn, restart:true},
  {key:'wifichannel',  label:'Channel',        type:'number', min:1, max:13, when:wifiOn,
    note:'optional — must match the WCB mesh channel if WCB Client is used (mesh channels are 1-11 only)', restart:true},
  {section:'Bluetooth Controller'},
  {key:'btcontrolleron', label:'Enable Bluetooth Controller', type:'bool'},
  {section:'WCB Client (Mesh Network)'},
  {key:'wcbenable', label:'Enable WCB Client', type:'bool'},
  {key:'wcboct2', label:'MAC Octet 2 (HEX)', type:'hex', maxlength:2, note:'00-FF, must match on all boards', when:wcbOn},
  {key:'wcboct3', label:'MAC Octet 3 (HEX)', type:'hex', maxlength:2, note:'00-FF, must match on all boards', when:wcbOn},
  {key:'wcbpassword', label:'Mesh Password', type:'password', maxlength:39, note:'max 39 chars', when:wcbOn},
  {key:'wcbquantity', label:'WCB Quantity', type:'number', min:0, max:19, when:wcbOn},
  {key:'wcbid', label:'This Device ID', type:'number', min:0, max:20, note:'1-19, or 20 for the special slot', when:wcbOn},
  {key:'outboundserial', label:'Outbound Destination', type:'select', when:wcbOn,
    options:[{v:'0', l:'UART0 (wired)'}, {v:'1', l:'WCB Mesh'}]}
];

// refreshWCBStatus() only runs once, when buildPage()'s callback fires on
// initial load -- doSave() has no reason to know about page-specific status
// panels, so without this hook a WCB identity-field edit that flips the
// server's reboot_required flag would never be reflected until the next
// full page load. See edit.js's doSave() for where this is called.
function _onConfigSaved(key) {
  if (key.indexOf('wcb') === 0 || key === 'outboundserial') refreshWCBStatus();
}

buildPage(SCHEMA, '/api/config', function() {
  // buildPage replaces main's innerHTML. Anchor each status panel right
  // after its section's toggle row rather than appending at the end of
  // <main>, so it reads as part of that section instead of trailing below
  // an unrelated one.
  var xbeeATPanel = document.createElement('div');
  xbeeATPanel.id = 'xbee-at-panel';
  var xblRow = document.querySelector('[data-key="xbl"]');
  if (xblRow) xblRow.insertAdjacentElement('afterend', xbeeATPanel);
  else document.querySelector('main').appendChild(xbeeATPanel);
  loadXbeeATPanel();

  var panel = document.createElement('div');
  panel.id = 'bt-panel';
  var btRow = document.querySelector('[data-key="btcontrolleron"]');
  if (btRow) btRow.insertAdjacentElement('afterend', panel);
  else document.querySelector('main').appendChild(panel);
  refreshBTStatus();

  var btHint = document.createElement('div');
  btHint.className = 'info-banner';
  btHint.innerHTML = 'Tip: set Controller Type &#8594; Bluetooth Gamepad on the '
    + '<a href="/config/controllers">Controllers</a> page once this is paired.';
  panel.insertAdjacentElement('afterend', btHint);

  var wcbPanel = document.createElement('div');
  wcbPanel.id = 'wcb-panel';
  var wcbRow = document.querySelector('[data-key="outboundserial"]');
  if (wcbRow) wcbRow.insertAdjacentElement('afterend', wcbPanel);
  else document.querySelector('main').appendChild(wcbPanel);
  refreshWCBStatus();
});

// ---- XBee module panel (issue #213) -----------------------------------------
// PAN ID / coordinator role read+write over the module's own local AT
// commands (see src/xbee_at_session.h) -- unlike the fields above, these
// live on the XBee module itself, not in params/EEPROM, so this panel
// always reflects a fresh, live read rather than a cached value.

var _xbeeAT = {
  panid: null,          // last known value (hex string), or null if unavailable
  isCoordinator: null,  // true/false, or null if unavailable
};

// Polls /api/xbee/status until the in-flight action settles (done/failed/
// timeout), then hands the final result to `onDone`. `onDone(null)` means
// the request itself never got accepted (e.g. a 409 -- something else was
// already in flight).
function xbeeATPoll(onDone) {
  fetch('/api/xbee/status').then(function(r) { return r.json(); }).then(function(d) {
    if (d.state === 'busy') setTimeout(function() { xbeeATPoll(onDone); }, 400);
    else onDone(d);
  }).catch(function() { onDone(null); });
}

function xbeeATStart(url, body, onDone) {
  fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: body
  }).then(function(r) {
    if (!r.ok) { onDone(null); return; }
    xbeeATPoll(onDone);
  }).catch(function() { onDone(null); });
}

// Only one XBee AT action can be in flight at a time (see
// XBeeATSession) -- the initial load chains the PAN ID and coordinator-role
// queries one after the other rather than firing them concurrently, which
// would just get the second one a 409.
function loadXbeeATPanel() {
  var panel = document.getElementById('xbee-at-panel');
  if (!panel) return;
  panel.innerHTML = '<div class="row"><div class="row-label">XBee Module</div>'
    + '<div class="rv" style="color:var(--muted)">Reading current settings&#8230;</div></div>';

  xbeeATStart('/api/xbee/query', 'cmd=ID', function(idResult) {
    _xbeeAT.panid = (idResult && idResult.state === 'done') ? idResult.value : null;
    xbeeATStart('/api/xbee/query', 'cmd=CE', function(ceResult) {
      _xbeeAT.isCoordinator = (ceResult && ceResult.state === 'done') ? (ceResult.value === '1') : null;
      renderXbeeATPanel();
    });
  });
}

function xbeeATResultMessage(result) {
  if (!result) return 'No response from the XBee module.';
  if (result.state === 'done') return 'Saved.';
  if (result.state === 'failed') {
    var reasons = {1: 'error', 2: 'invalid command', 3: 'invalid parameter', 4: 'transmit failure'};
    return 'Failed (' + (reasons[result.status] || ('status ' + result.status)) + ').';
  }
  if (result.state === 'timeout') return 'XBee did not respond in time.';
  return 'Could not reach the XBee.';
}

function renderXbeeATPanel() {
  var panel = document.getElementById('xbee-at-panel');
  if (!panel) return;
  var html = '<div class="section-label">XBee Module</div>';

  // Same edit-in-place row as every other setting on this page (display
  // value, pencil -> input + SAVE/cancel), built with the shared buildRow()
  // so it can't drift visually. Only the SAVE handler differs: this value
  // lives on the XBee module itself (set via its own AT command), not in
  // /api/config, so it can't go through the generic doSave().
  if (_xbeeAT.panid !== null) {
    html += buildRow({key: 'xbee-panid', label: 'PAN ID', type: 'hex', maxlength: 16,
                      note: 'hex, up to 16 digits'}, _xbeeAT.panid)
      .replace('onclick="doSave(this)"', 'onclick="saveXbeePanId(this)"');
  } else {
    html += '<div class="row"><div class="row-label">PAN ID</div>'
          + '<div class="rv" style="color:var(--muted)">Unavailable — check XBee wiring/power</div></div>';
  }

  html += '<div class="row"><div class="row-label">Role</div>';
  if (_xbeeAT.isCoordinator === true) {
    html += '<div class="rv">Amidala XBee is set as the coordinator</div>';
  } else if (_xbeeAT.isCoordinator === false) {
    html += '<div class="rv">Not configured as coordinator</div>'
          + '<div class="ri"><button class="be-action" onclick="setXbeeCoordinator()">Set as Coordinator</button></div>';
  } else {
    html += '<div class="rv" style="color:var(--muted)">Unavailable — check XBee wiring/power</div>';
  }
  html += '</div>';
  html += '<div id="xbee-coordinator-status" style="font-size:.72rem;color:var(--muted);padding:0 0 .5rem"></div>';

  panel.innerHTML = html;
}

// Mirrors doSave()'s in-place feedback (button shows an ellipsis while in
// flight, toast on result, row drops back to its display state on success)
// -- see edit.js.
function saveXbeePanId(btn) {
  var row = btn.closest('.row');
  var inp = row.querySelector('input');
  var value = inp.value.trim().toUpperCase();
  // Anything that isn't plain hex would be silently read as zeros by the
  // firmware's hex parser -- and ID=0 means "pick a random PAN ID", which
  // is a surprising thing to get from a typo.
  if (!/^[0-9A-F]{1,16}$/.test(value)) {
    showToast('PAN ID must be 1-16 hex digits', true);
    return;
  }
  var prev = btn.textContent;
  btn.textContent = '…';
  btn.disabled = true;
  xbeeATStart('/api/xbee/set', 'cmd=ID&value=' + encodeURIComponent(value), function(result) {
    btn.textContent = prev;
    btn.disabled = false;
    if (result && result.state === 'done') {
      _xbeeAT.panid = value;
      row.querySelector('.rv').textContent = value;
      inp.value = value;
      inp.dataset.orig = value;
      _closeEditUI(row);
      showToast('Saved');
    } else {
      showToast(xbeeATResultMessage(result), true);
    }
  });
}

// A coordinator must never sleep: Digi's CE=1 ("form network") requires
// SM=0 (sleep disabled), so SM=0 is sent first and CE=1 only follows if it
// succeeded -- setting them the other way around would just get CE=1
// rejected on a module that's currently configured to sleep. Two separate
// set-and-persist actions (each followed by its own WR) rather than one
// combined action, since XBeeATSession only handles one at a time.
function setXbeeCoordinator() {
  var statusEl = document.getElementById('xbee-coordinator-status');
  statusEl.textContent = 'Setting…';
  xbeeATStart('/api/xbee/set', 'cmd=SM&value=0', function(smResult) {
    if (!smResult || smResult.state !== 'done') {
      statusEl.textContent = xbeeATResultMessage(smResult);
      return;
    }
    xbeeATStart('/api/xbee/set', 'cmd=CE&value=1', function(ceResult) {
      if (ceResult && ceResult.state === 'done') {
        _xbeeAT.isCoordinator = true;
        statusEl.textContent = '';
        renderXbeeATPanel();
        showToast('XBee set as coordinator');
      } else {
        statusEl.textContent = xbeeATResultMessage(ceResult);
      }
    });
  });
}

// ---- Bluetooth panel -------------------------------------------------------

var _scanning  = false;
var _scanTimer = null;

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function refreshBTStatus() {
  fetch('/api/bt/status').then(function(r) {
    if (!r.ok) return;
    return r.json();
  }).then(function(d) {
    if (!d) return;
    var panel = document.getElementById('bt-panel');
    if (!panel) return;

    if (!d.enabled) {
      panel.innerHTML = '<div class="row"><div class="row-label" style="color:var(--muted)">'
        + 'Enable above to scan and pair a controller.</div></div>';
      return;
    }

    var connText = d.connected
      ? (d.addr ? escHtml(d.addr) : 'Connected')
      : 'Not connected';

    var html = '';

    // Status row
    html += '<div class="row"><div class="row-label">Controller</div>';
    html += '<div class="rv">' + connText + '</div>';
    html += '<div class="ri">';
    html += '<button class="be-action" onclick="startScan()" ' + (_scanning ? 'disabled' : '') + '>'
          + (_scanning ? 'Scanning…' : 'Scan') + '</button>';
    if (d.connected) {
      html += '<button class="be-action" onclick="forgetDevice()">Forget</button>';
    }
    html += '</div></div>';

    // Local ESP32 BT address row
    if (d.local_addr) {
      html += '<div class="row"><div class="row-label">ESP32 address</div>'
            + '<div class="rv">' + escHtml(d.local_addr) + '</div></div>';
    }

    // Scan results
    html += '<div id="bt-results-area"></div>';

    panel.innerHTML = html;
    if (_scanning) pollScanResults();
  }).catch(function() {
    // /api/bt/status not available (shouldn't happen — route is unconditional).
    var panel = document.getElementById('bt-panel');
    if (panel) panel.innerHTML = '';
  });
}

function startScan() {
  if (_scanning) return;
  _scanning = true;
  fetch('/api/bt/scan', {method:'POST'}).then(function() {
    refreshBTStatus();
    if (_scanTimer) clearTimeout(_scanTimer);
    _scanTimer = setTimeout(function() {
      _scanning = false;
      pollScanResults();
    }, 6000);
  });
}

function pollScanResults() {
  fetch('/api/bt/results').then(function(r) { return r.json(); }).then(function(devs) {
    renderScanResults(devs);
    if (_scanning) setTimeout(pollScanResults, 1000);
    else refreshBTStatus();
  }).catch(function() {});
}

function renderScanResults(devs) {
  var area = document.getElementById('bt-results-area');
  if (!area) return;
  if (!devs || devs.length === 0) {
    area.innerHTML = '<div class="row"><div class="row-label" style="color:var(--muted)">'
      + (_scanning ? 'Scanning…' : 'No BLE HID controllers found.') + '</div></div>';
    return;
  }
  var html = '<div class="section-label">Found Controllers</div>';
  for (var i = 0; i < devs.length; i++) {
    var d = devs[i];
    var name = d.name || 'Unknown Controller';
    html += '<div class="row">';
    html += '<div class="row-label">' + escHtml(name)
          + '<br><span style="font:500 11px/1 ui-monospace,\'SF Mono\',Menlo,monospace;color:var(--muted)">'
          + escHtml(d.addr) + ' &nbsp;&middot;&nbsp; ' + d.rssi + ' dBm</span></div>';
    html += '<div class="ri"><button class="be-action" onclick="pairWith(' + JSON.stringify(d.addr) + ')">Pair</button></div>';
    html += '</div>';
  }
  area.innerHTML = html;
}

function pairWith(addr) {
  fetch('/api/bt/pair', {
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:'addr=' + encodeURIComponent(addr)
  }).then(function() {
    _scanning = false;
    refreshBTStatus();
  });
}

function forgetDevice() {
  if (!confirm('Forget the paired Bluetooth controller?')) return;
  fetch('/api/bt/forget', {method:'POST'}).then(function() { refreshBTStatus(); });
}

// ---- WCB Client panel -------------------------------------------------------

function refreshWCBStatus() {
  fetch('/api/wcb/status').then(function(r) {
    if (!r.ok) return;
    return r.json();
  }).then(function(d) {
    if (!d) return;
    var panel = document.getElementById('wcb-panel');
    if (!panel) return;

    if (!d.enabled) {
      panel.innerHTML = '<div class="row"><div class="row-label" style="color:var(--muted)">'
        + 'Enable above to join the WCB mesh network.</div></div>';
      return;
    }

    var html = '';

    if (d.reboot_required) _flagRestartRequired();

    var statusText = !d.configured
      ? 'Not configured — check the fields above'
      : !d.running
        ? 'Not running'
        : d.joined
          ? 'Connected'
          : 'Running — no neighbors seen';
    var dot = d.joined
      ? '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#3a3;margin-right:6px;vertical-align:middle"></span>'
      : '';

    html += '<div class="row"><div class="row-label">Mesh</div>';
    html += '<div class="rv">' + dot + escHtml(statusText) + '</div></div>';

    if (d.configured) {
      html += '<div class="row"><div class="row-label">Device ID</div>'
            + '<div class="rv">' + d.device_id + ' of ' + d.quantity + '</div></div>';
    }

    panel.innerHTML = html;
  }).catch(function() {
    var panel = document.getElementById('wcb-panel');
    if (panel) panel.innerHTML = '';
  });
}
</script>
</body>
</html>
